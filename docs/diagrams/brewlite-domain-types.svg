  <text x="42" y="990" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#455B6B">&lt;&lt;value object / order-time values&gt;&gt;</text>
  <text x="42" y="1015" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#182B3A" font-weight="bold">ToppingSnapshot</text>
  <text x="42" y="1052" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#182B3A">code: String</text>
  <text x="42" y="1076" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#182B3A">name: String</text>
  <text x="42" y="1100" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#182B3A">priceVnd: MoneyVnd</text>
  <text x="640" y="1000" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#455B6B">OrderItem owns 0..3 ToppingSnapshot values; names and prices remain unchanged after checkout.</text>
  <text x="640" y="1030" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#455B6B">Snapshot mapping: toppingCodeSnapshot, toppingNameSnapshot, toppingPriceSnapshotVnd.</text>
  <text x="30" y="1135" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#455B6B">MoneyVnd = integer VND (BigInt internally); DateTime = timezone-aware instant; [0..1] = optional.</text>
  <text x="30" y="1160" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#455B6B">GRACE is a time window. EXPIRED is a failure reason. Neither is an OrderStatus or PaymentStatus.</text>
  <text x="30" y="1185" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#455B6B">Payment resolution is derived presentation data; REQUIRES_REVIEW belongs to reconciliation, not PaymentStatus.</text>
