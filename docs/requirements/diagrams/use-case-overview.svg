><text x="1320" y="1281" text-anchor="middle" font-size="20">Preview coupon — SHOULD (*)</text><g stroke="#172b4d" stroke-width="3" fill="white"><circle cx="150" cy="244" r="18"/><path d="M 150 262 V 320 M 120 288 H 180 M 150 320 L 125 355 M 150 320 L 175 355" fill="none"/></g><text x="150" y="386" text-anchor="middle" font-size="20">Guest</text><g stroke="#172b4d" stroke-width="3" fill="white"><circle cx="150" cy="984" r="18"/><path d="M 150 1002 V 1060 M 120 1028 H 180 M 150 1060 L 125 1095 M 150 1060 L 175 1095" fill="none"/></g><text x="150" y="1126" text-anchor="middle" font-size="20">Customer</text><g stroke="#172b4d" stroke-width="3" fill="white"><circle cx="1840" cy="664" r="18"/><path d="M 1840 682 V 740 M 1810 708 H 1870 M 1840 740 L 1815 775 M 1840 740 L 1865 775" fill="none"/></g><text x="1840" y="806" text-anchor="middle" font-size="20">Người vận hành demo</text><g stroke="#172b4d" stroke-width="3" fill="white"><circle cx="1840" cy="954" r="18"/><path d="M 1840 972 V 1030 M 1810 998 H 1870 M 1840 1030 L 1815 1065 M 1840 1030 L 1865 1065" fill="none"/></g><text x="1840" y="1096" text-anchor="middle" font-size="20">VNPay Sandbox</text><rect x="80" y="1400" width="1840" height="265" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/><text x="110" y="1444" font-size="20">UC-ORD-003: chỉ tự hết hạn đơn; Customer Cancel vẫn Deferred. Không có UI Admin/Barista mới.</text><text x="110" y="1487" font-size="20">(*) UC-PRO-002: nguồn cũ SHOULD/Deferred; SCRUM-96 confirmed implementation; A2 scope/acceptance cần xác nhận.</text><text x="110" y="1530" font-size="20">Mock, ZERO_AMOUNT và scheduler là thành phần nội bộ. VNPay Sandbox gắn thanh toán, IPN và QueryDR.</text><text x="110" y="1573" font-size="20">QueryDR vẫn In Scope; kiểm chứng Sandbox E2E còn Deferred. Association không tự cấp quyền hoặc chứng minh PASS.</text><text x="110" y="1616" font-size="20">Kế thừa: docs/diagram/UseCase_Diagram.drawio.svg và catalog UC v3.0/v3.1; không tạo thêm UC.</text></g></svg>
